<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DDistillers Member Card</title>
<style>
  :root {
    --navy: #092f33;
    --teal: #075b61;
    --gold: #c9a44c;
    --gold-light: #e8cf83;
    --cream: #f7f3e9;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 32px 16px;
    font-family: Inter, Arial, Helvetica, sans-serif;
    background:
      radial-gradient(circle at 15% 10%, rgba(201,164,76,.16), transparent 28%),
      radial-gradient(circle at 85% 90%, rgba(7,91,97,.18), transparent 30%),
      #eef1ed;
  }

  .member-card {
    position: relative;
    width: min(920px, 100%);
    min-height: 520px;
    overflow: hidden;
    border-radius: 30px;
    background:
      linear-gradient(135deg, rgba(255,255,255,.06), transparent 40%),
      var(--navy);
    box-shadow: 0 28px 70px rgba(0,0,0,.22);
    color: var(--white);
    isolation: isolate;
  }

  .member-card::before {
    content: "";
    position: absolute;
    width: 440px;
    height: 440px;
    right: -140px;
    top: -150px;
    border: 1px solid rgba(232,207,131,.24);
    border-radius: 50%;
    box-shadow:
      0 0 0 45px rgba(232,207,131,.035),
      0 0 0 90px rgba(232,207,131,.025);
    z-index: -1;
  }

  .member-card::after {
    content: "";
    position: absolute;
    width: 260px;
    height: 260px;
    left: -110px;
    bottom: -130px;
    background: rgba(201,164,76,.08);
    border-radius: 50%;
    filter: blur(2px);
    z-index: -1;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 34px 0;
  }

  .logo {
    width: 190px;
    max-height: 58px;
    object-fit: contain;
    object-position: left center;
    filter: brightness(0) invert(1);
  }

  .member-label {
    color: var(--gold-light);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 2.8px;
    text-transform: uppercase;
  }

  .content {
    display: grid;
    grid-template-columns: 1.05fr .95fr;
    gap: 24px;
    align-items: center;
    min-height: 420px;
    padding: 10px 34px 34px;
  }

  .left {
    padding: 12px 0 10px;
  }

  .eyebrow {
    margin: 0 0 9px;
    color: var(--gold-light);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  h1 {
    margin: 0;
    font-size: clamp(34px, 5vw, 58px);
    line-height: .98;
    letter-spacing: -2px;
  }

  .subtitle {
    max-width: 470px;
    margin: 18px 0 25px;
    color: rgba(255,255,255,.72);
    line-height: 1.7;
    font-size: 15px;
  }

  .details {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .pill {
    border: 1px solid rgba(232,207,131,.35);
    background: rgba(255,255,255,.055);
    border-radius: 999px;
    padding: 9px 13px;
    color: #f6ead0;
    font-size: 12px;
    font-weight: 700;
  }

  .member-number {
    margin-top: 28px;
    color: rgba(255,255,255,.55);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .member-number strong {
    display: block;
    margin-top: 7px;
    color: var(--white);
    font-size: 17px;
    letter-spacing: 1.5px;
  }

  .product-panel {
    position: relative;
    min-height: 360px;
    display: grid;
    place-items: center;
  }

  .product-glow {
    position: absolute;
    width: 310px;
    height: 310px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(201,164,76,.23), rgba(201,164,76,0) 68%);
  }

  .product {
    position: relative;
    width: min(330px, 80%);
    height: 330px;
    object-fit: contain;
    filter: drop-shadow(0 30px 20px rgba(0,0,0,.38));
    transform: translateY(-4px);
  }

  .product-caption {
    position: absolute;
    bottom: 4px;
    right: 8px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(0,0,0,.24);
    border: 1px solid rgba(255,255,255,.09);
    backdrop-filter: blur(8px);
    color: rgba(255,255,255,.72);
    font-size: 10px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }

  .gold-line {
    position: absolute;
    left: 34px;
    right: 34px;
    bottom: 16px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232,207,131,.55), transparent);
  }

  @media (max-width: 700px) {
    body { padding: 14px; }
    .member-card { min-height: auto; border-radius: 22px; }
    .topbar { padding: 22px 22px 0; }
    .logo { width: 150px; }
    .content {
      grid-template-columns: 1fr;
      padding: 8px 22px 36px;
    }
    .left { order: 2; text-align: center; }
    .subtitle { margin-left: auto; margin-right: auto; }
    .details { justify-content: center; }
    .member-number { text-align: center; }
    .product-panel {
      order: 1;
      min-height: 300px;
    }
    .product { width: 290px; height: 290px; }
    .product-caption { right: 50%; transform: translateX(50%); white-space: nowrap; }
    .gold-line { left: 22px; right: 22px; }
  }
</style>
</head>
